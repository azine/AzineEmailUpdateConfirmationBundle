name: Verify Email Update Confirmation 2.0.0 Symfony kernel

on:
  push:
    branches: [release/publish-2.0.0]
    paths: ['.github/workflows/verify-2.0.0-kernel.yml']

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
          extensions: ctype, iconv, intl, json, mbstring, openssl, tokenizer, xml
      - name: Build and boot minimal Symfony 7.4 consumer
        run: |
          set -euo pipefail
          APP=/tmp/email-update-kernel
          mkdir -p "$APP/src" "$APP/config/packages" "$APP/var/cache" "$APP/var/log"
          cd "$APP"

          cat > composer.json <<'JSON'
          {
              "name": "azine/kernel-smoke",
              "repositories": [
                  {
                      "type": "vcs",
                      "url": "https://github.com/azine/AzineEmailUpdateConfirmationBundle"
                  }
              ],
              "require": {
                  "php": "^8.5",
                  "azine/emailupdateconfirmation-bundle": "2.0.0",
                  "symfony/dotenv": "7.4.*",
                  "symfony/framework-bundle": "7.4.*",
                  "symfony/twig-bundle": "7.4.*"
              },
              "autoload": {
                  "psr-4": {
                      "App\\\\": "src/"
                  }
              },
              "minimum-stability": "stable",
              "prefer-stable": true
          }
          JSON
          composer update --no-interaction --prefer-dist

          cat > src/Kernel.php <<'PHP'
          <?php
          declare(strict_types=1);
          namespace App;
          use Symfony\Bundle\FrameworkBundle\Kernel\MicroKernelTrait;
          use Symfony\Component\HttpKernel\Kernel as BaseKernel;
          final class Kernel extends BaseKernel
          {
              use MicroKernelTrait;
              public function getProjectDir(): string
              {
                  return dirname(__DIR__);
              }
          }
          PHP

          cat > config/bundles.php <<'PHP'
          <?php
          return [
              Symfony\Bundle\FrameworkBundle\FrameworkBundle::class => ['all' => true],
              Symfony\Bundle\TwigBundle\TwigBundle::class => ['all' => true],
              Azine\EmailUpdateConfirmationBundle\AzineEmailUpdateConfirmationBundle::class => ['all' => true],
          ];
          PHP

          cat > config/packages/framework.yaml <<'YAML'
          framework:
              secret: kernel-smoke-secret
              test: true
              router:
                  utf8: true
              mailer:
                  dsn: 'null://null'
              validation:
                  enable_attributes: true
              translator:
                  fallbacks: ['en']
          YAML

          cat > config/packages/azine_email_update_confirmation.yaml <<'YAML'
          azine_email_update_confirmation:
              redirect_route: smoke_target
              from_email:
                  address: no-reply@example.test
                  sender_name: Kernel Smoke
          YAML

          cat > config/services.yaml <<'YAML'
          services:
              fos_user.util.token_generator:
                  class: stdClass
              fos_user.util.canonical_fields_updater:
                  class: stdClass
              fos_user.user_manager:
                  class: stdClass
          YAML

          cat > config/routes.yaml <<'YAML'
          smoke_target:
              path: /target
              controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController
              defaults:
                  route: smoke_target

          email_update:
              resource: '@AzineEmailUpdateConfirmationBundle/Resources/config/routing.yml'
          YAML

          APP_ENV=test APP_DEBUG=0 php -r "require 'vendor/autoload.php'; \$kernel = new App\\Kernel('test', false); \$kernel->boot(); if (!\$kernel->getContainer()->has('router')) { exit(1); } \$kernel->shutdown();"
