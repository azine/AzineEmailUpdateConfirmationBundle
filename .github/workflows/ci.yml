name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: "PHP 8.5 / Dependencies ${{ matrix.dependencies }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        dependencies: [stable, lowest]

    env:
      MAILER_DSN: 'null://null'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
          extensions: ctype, fileinfo, filter, iconv, intl, json, mailparse, mbstring, openssl, tokenizer, xml

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-php85-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php85-${{ matrix.dependencies }}-

      - name: Install stable dependencies
        if: matrix.dependencies == 'stable'
        run: composer update --no-interaction --prefer-dist

      - name: Install lowest dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --no-interaction --prefer-lowest --prefer-stable --prefer-dist

      - name: Lint production and test code
        run: composer lint

      - name: Run strict test suite
        run: >-
          vendor/bin/phpunit -c phpunit.xml.dist
          --display-deprecations
          --display-phpunit-deprecations
          --display-phpunit-notices
          --display-notices
          --display-skipped
          --fail-on-deprecation
          --fail-on-phpunit-deprecation
          --fail-on-phpunit-notice
          --fail-on-notice
          --fail-on-skipped
