name: Apply secure Symfony 7.4 upgrade

on:
  push:
    branches:
      - upgrade/php-8.5-symfony-7.4

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v6
        with:
          ref: upgrade/php-8.5-symfony-7.4

      - name: Extract reviewed implementation
        run: |
          base64 -d .upgrade/secure-symfony-7.4.tar.gz.b64 | tar -xz
          rm -f .upgrade/secure-symfony-7.4.tar.gz.b64
          rmdir .upgrade 2>/dev/null || true
          rm -f travis.php.ini

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Implementation is already applied.'
            exit 0
          fi
          git commit -m 'Complete secure Symfony 7.4 email confirmation upgrade'
          git push origin HEAD:upgrade/php-8.5-symfony-7.4
