name: Verify Email Update Confirmation 2.0.0 consumer install

on:
  push:
    branches: [release/publish-2.0.0]
    paths: ['.github/workflows/verify-2.0.0-consumer.yml']

permissions:
  contents: read

jobs:
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
          extensions: ctype, iconv, intl, json, mbstring, openssl, tokenizer, xml
      - name: Install immutable release in a clean consumer
        run: |
          mkdir /tmp/email-update-consumer
          cd /tmp/email-update-consumer
          composer init --name=azine/release-smoke --no-interaction
          composer config repositories.email-update vcs https://github.com/azine/AzineEmailUpdateConfirmationBundle
          composer require azine/emailupdateconfirmation-bundle:2.0.0 --no-interaction --prefer-dist
          php -r "require 'vendor/autoload.php'; \$bundle = new Azine\\EmailUpdateConfirmationBundle\\AzineEmailUpdateConfirmationBundle(); if (!\$bundle instanceof Symfony\\Component\\HttpKernel\\Bundle\\Bundle) { exit(1); }"
